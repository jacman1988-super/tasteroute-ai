<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TasteRoute AI — travel at your pace</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head><body><header><a href="/">↗ TasteRoute <span>AI</span></a><button id="language" class="text-button">Polski</button></header><main><p id="eyebrow" class="eyebrow"></p><h1 id="headline"></h1><p id="intro" class="intro"></p><div class="layout"><section class="card"><p id="form-kicker" class="eyebrow"></p><h2 id="form-title"></h2><form id="preferences"><label id="city-label" for="city"></label><select id="city"><option value="lisbon">Lisbon, Portugal</option><option value="krakow">Kraków, Poland</option><option value="warsaw">Warsaw, Poland</option><option value="barcelona">Barcelona, Spain</option></select><div class="pair"><div><label id="days-label" for="days"></label><select id="days"><option>1</option><option selected>2</option><option>3</option></select></div><div><label id="pace-label" for="pace"></label><select id="pace"><option value="calm"></option><option value="balanced"></option><option value="active"></option></select></div></div><fieldset><legend id="interests-label"></legend><div id="interests" class="interests"></div></fieldset><button id="find" type="submit" class="primary"></button><p id="privacy" class="fine"></p></form><div id="choices"></div><button id="plain" hidden class="secondary"></button><div class="ai-setup"><h3 id="ai-title"></h3><p id="ai-info" class="fine"></p><button id="load" class="secondary"></button><p id="model-status" role="status" class="fine"></p><button id="plan" hidden class="primary"></button><button id="cancel" hidden class="text-button"></button></div></section><section class="results card"><p id="result-kicker" class="eyebrow"></p><h2 id="result-title"></h2><p id="status" role="status"></p><div id="trace"></div><div id="places"></div><button id="download" hidden class="text-button"></button><p id="limits" class="fine"></p></section></div></main><footer><a href="https://github.com/jacman1988-super/tasteroute-ai" target="_blank" rel="noopener noreferrer">GitHub ↗</a><span id="footer-note"></span></footer></body></html>
